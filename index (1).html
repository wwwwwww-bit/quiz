<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审神者收心测试</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #f2f0eb;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2c2c2c;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .survey {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
    align-self: flex-start;
  }

  .bar {
    height: 4px;
    background: #e8e4dc;
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: #c9a86a;
    border-radius: 2px;
    transition: width .35s ease;
  }
  .progress {
    text-align: center;
    color: #a8a29a;
    font-size: .82em;
    letter-spacing: .1em;
    margin-bottom: 28px;
  }

  .q-title {
    font-size: 1.25em;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .q-sub {
    font-size: .88em;
    color: #999;
    margin: -14px 0 20px;
    line-height: 1.6;
  }

  .q-img {
    max-width: 100%;
    border-radius: 10px;
    margin: 0 0 20px;
    display: block;
    min-height: 80px;
    background: #f7f5f0;
    border: 2px dashed #d8d2c6;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    padding: 13px 18px;
    border: 2px solid #e8e4dc;
    border-radius: 10px;
    background: #fff;
    color: #2c2c2c;
    font-size: .98em;
    font-family: inherit;
    text-align: left;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .option:hover {
    border-color: #c9a86a;
    background: #faf6ee;
    transform: translateX(4px);
  }
  .option.selected {
    border-color: #c9a86a;
    background: #faf6ee;
  }

  /* 吐槽区 */
  .react-box {
    min-height: 0;
    margin-top: 14px;
    font-size: .88em;
    color: #b0a898;
    line-height: 1.6;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .react-box.show { opacity: 1; }

  .multi-hint {
    font-size: .82em;
    color: #b0a898;
    margin-bottom: 14px;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e8e4dc;
    border-radius: 10px;
    font-size: 1em;
    font-family: inherit;
    color: #2c2c2c;
    transition: border-color .15s;
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #c9a86a;
    background: #fdfbf7;
  }

  .btn {
    display: inline-block;
    padding: 12px 30px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #c9a86a;
    color: #fff;
    font-size: .98em;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: #b8975a; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: #d8d2c6; cursor: not-allowed; }
  .btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn-ghost {
    background: transparent;
    color: #a8a29a;
    padding: 12px 14px;
    margin-top: 20px;
  }
  .btn-ghost:hover { background: #f2f0eb; color: #777; }

  .fade { animation: fadeIn .3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result { text-align: center; }
  .result h2 { font-size: 1.5em; margin: 0 0 8px; }
  .result .score {
    font-size: 2.6em;
    font-weight: 700;
    color: #c9a86a;
    margin: 16px 0 4px;
  }
  .result .score-label {
    color: #a8a29a;
    font-size: .85em;
    letter-spacing: .1em;
    margin-bottom: 24px;
  }
  .result .diagnosis {
    background: #faf6ee;
    border-radius: 12px;
    padding: 24px;
    text-align: left;
    line-height: 1.8;
    color: #555;
    font-size: .98em;
  }
  .result .diagnosis strong {
    display: block;
    font-size: 1.15em;
    color: #2c2c2c;
    margin-bottom: 10px;
  }
  .result .two-scores {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 20px 0 8px;
  }
  .result .two-scores .item {
    flex: 1;
    background: #faf6ee;
    border-radius: 12px;
    padding: 16px 12px;
  }
  .result .two-scores .num {
    font-size: 1.8em;
    font-weight: 700;
    color: #c9a86a;
    line-height: 1.2;
  }
  .result .two-scores .lbl {
    font-size: .8em;
    color: #a8a29a;
    letter-spacing: .1em;
    margin-top: 4px;
  }

  .cover { text-align: center; padding: 24px 0 8px; }
  .cover-sub {
    font-size: .8em;
    color: #b0a898;
    letter-spacing: .2em;
    margin-bottom: 20px;
  }
  .cover-title {
    font-size: 2em;
    font-weight: 700;
    letter-spacing: .08em;
    margin: 0 0 24px;
    color: #2c2c2c;
  }
  .cover-desc {
    font-size: .98em;
    line-height: 2;
    color: #666;
    margin: 0 0 20px;
  }
  .cover-note {
    font-size: .82em;
    color: #b0a898;
    margin: 0 0 36px;
  }
  .cover-btn {
    padding: 14px 48px;
    font-size: 1.05em;
    margin-top: 0;
  }
</style>
</head>
<body>

<div class="survey">
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="progress" id="progress"></div>
  <div id="qbox"></div>
</div>

<script>
/* ============================================================
   1. 题目配置
   type: "single" 单选 / "multi" 多选 / "text" 填空
   score: { shou: 收心分, zheng: 整活分 }（可省略，默认 0）
   react: 点击后的吐槽文字
   ============================================================ */
const questions = [
  {
    id: "q1",
    type: "text",
    title: "请输入你的名字。",
    placeholder: "在这里输入...",
    isTrap: true
  },
  {
    id: "q2",
    type: "single",
    title: "下面选项里面，哪振刀的机动最高？",
    options: [
      { text: "A. 极化199的博多藤四郎", score: { shou: 1 } },
      { text: "B. 极化199的后藤藤四郎", score: { shou: 0.5 } },
      { text: "C. 极化199的爱染国俊", score: { shou: 0.5 } },
      { text: "D. 发现主君被欺负的压切长谷部", score: { zheng: 1 } }
    ]
  },
  {
    id: "q3",
    type: "single",
    title: "下面选项里面，哪一组编队适合打合战场6-4（池田屋一楼）？",
    options: [
      { text: "A. 一队40级的极化短刀", score: { shou: 1 } },
      { text: "B. 一队40级的普通短刀", score: { shou: 1 } },
      { text: "C. 一队40级的极化太刀", score: { zheng: 1 }, react: "太刀夜战？" },
      { text: "D. 一队40级的普通太刀", score: { zheng: 1 }, react: "？" }
    ]
  },
  {
    id: "q4",
    type: "single",
    title: "下面的四个选项里面，哪一振极化刀的打击最高？（不含乱舞加成和装备加成）",
    options: [
      { text: "A. 千代金丸" },
      { text: "B. 狮子王" },
      { text: "C. 和泉守兼定", score: { shou: 2 } },
      { text: "D. 巴型薙刀" }
    ]
  },
  {
    id: "q5",
    type: "single",
    title: "下面的四个数值里面，哪一个最接近极化太刀35级的经验值？",
    options: [
      { text: "A. 2012485", score: { shou: 2 } },
      { text: "B. 1890485" },
      { text: "C. 1686985" },
      { text: "D. 1782485" }
    ]
  },
  {
    id: "q6",
    type: "single",
    title: "下面哪种情况下，三日月宗近的机动值最高？",
    options: [
      { text: "A. 金刀装", score: { shou: 0.5 } },
      { text: "B. 金刀装配小云雀", score: { shou: 0.5 } },
      { text: "C. 金刀装配小云雀加宝物", score: { shou: 1 } },
      { text: "D. 开丰田Crown Crossover（皇冠跨界版）", score: { zheng: 2 }, react: "啊哈哈哈哈……老爷爷还以为是加速带呢，原来是时溯军啊，你看这事闹的，阿路基。" }
    ]
  },
  {
    id: "q7",
    type: "single",
    title: "<s>小明感慨说太刀虽然貌美但是夜间战场有削弱buff，机动也低于短刀，小红反驳说她曾经看见过太刀夜战。算了不演了。</s>判断题：“三日月能飞。”请问这个观点是否正确。",
    options: [
      { text: "A. 是", score: { zheng: 1 }, react: "对的对的" },
      { text: "B. 否", score: { shou: 1 }, react: "对的对的" }
    ]
  },
  {
    id: "q8",
    type: "multi",
    title: "多选题：光忠特制——（　）",
    options: [
      { text: "以下全部" },
      { text: "A. 牡丹饼", score: { zheng: 2 } },
      { text: "B. 枝豆饼", score: { shou: 0.5 } },
      { text: "C. 明太子", score: { shou: 0.5 } },
      { text: "D. 烤红薯", score: { shou: 0.5 } },
      { text: "E. 酸梅干", score: { shou: 0.5 } },
      { text: "F. 焦糖布丁", score: { shou: 0.5 } },
      { text: "G. 吐司面包", score: { shou: 0.5 } },
      { text: "H. 关东煮", score: { shou: 0.5 } },
      { text: "I. 鲷鱼烧", score: { shou: 0.5 } },
      { text: "J. 吉备团子", score: { shou: 0.5 } },
      { text: "K. 醋昆布", score: { shou: 0.5 } },
      { text: "L. 松饼", score: { shou: 0.5 } },
      { text: "M. 长崎蛋糕", score: { shou: 0.5 } },
      { text: "N. 沙拉杯", score: { shou: 0.5 } },
      { text: "O. 金平糖", score: { shou: 0.5 } },
      { text: "P. 蛋糕", score: { shou: 0.5 } },
      { text: "Q. 鸡腿", score: { shou: 0.5 } },
      { text: "R. 马卡龙", score: { shou: 0.5 } },
      { text: "S. 俄罗斯转盘泡芙", score: { shou: 0.5 } },
      { text: "T. 土豆炖肉", score: { shou: 0.5 } },
      { text: "U. 仙贝", score: { shou: 0.5 } },
      { text: "V. 小饼干", score: { shou: 0.5 } },
      { text: "W. 甜甜圈", score: { shou: 0.5 } },
      { text: "X. 金锷烧", score: { shou: 0.5 } },
      { text: "Y. 汉堡肉", score: { shou: 0.5 } },
      { text: "Z. 栗金团", score: { shou: 0.5 } }
    ]
  },
  {
    id: "q9",
    type: "single",
    title: "下面的四个选项里面，哪一振刀的年龄最大？",
    options: [
      { text: "A. 小乌丸" },
      { text: "B. 丙子椒林剑", score: { shou: 1 } },
      { text: "C. 和泉守兼定" },
      { text: "D. 三日月宗近" }
    ]
  },
  {
    id: "q10",
    type: "multi",
    title: "多选题：下面的四个选项里面，哪两个可以触发[回想184]本科と写し？",
    options: [
      { text: "A. 山姥切长义" },
      { text: "B. 山姥切国广" },
      { text: "C. 安宅切", score: { shou: 1 } },
      { text: "D. 压切长谷部", score: { shou: 1 } }
    ]
  },
  {
    id: "q11",
    type: "multi",
    title: "不定项选择题：如图所示，图中人物的名称是？",
    sub: "（图源 xhs 按羽羽羽羽羽）",
    img: "img11.jpg",
    options: [
      { text: "A. 腿丸", score: { zheng: 1 } },
      { text: "B. 大根", score: { shou: 1 } },
      { text: "C. 肘丸", score: { zheng: 1 } },
      { text: "D. 萝卜丸", score: { zheng: 1 }, react: "也对？" }
    ]
  },
  {
    id: "q12",
    type: "multi",
    title: "不定项选择题：如图所示，图中人物的名称是？",
    img: "img12.jpg",
    options: [
      { text: "A. 腿丸", score: { zheng: 1 }, react: "？" },
      { text: "B. 绿丸", score: { zheng: 1 }, react: "？？" },
      { text: "C. 肘丸", score: { zheng: 1 }, react: "？？？" },
      { text: "D. 膝丸", score: { shou: 1 } }
    ]
  },
  {
    id: "q13",
    type: "single",
    title: "当你要支持你的同事购买对方喜欢的三丽鸥时，你会选择发送哪个表情包？（选项D图源xhs咸卷）",
    img: "img13.jpg",
    options: [
      { text: "A. 平安老刀又能有什么坏心思呢", score: { zheng: 1 } },
      { text: "B. 你尽管出去找男人", score: { zheng: 2 } },
      { text: "C. 买吧又不贵", score: { shou: 1 } },
      { text: "D. 一直在挑衅我们", score: { zheng: 2 } }
    ]
  },
  {
    id: "q14",
    type: "single",
    title: "某本丸需要将一振1级普刀提升到99级。目前的活动有：「联队战~海边之阵~」以及刀剑育成计划三倍经验，本丸有300枚「根兵糖·上」。请问，至少需要多少时间可以将这振刀提升到99级？",
    options: [
      { text: "A. 5分钟", score: { zheng: 1 }, react: "现在有个很严肃的问题，付丧神会蛀牙吗……？" },
      { text: "B. 一天", score: { shou: 1 } },
      { text: "C. 三天", score: { shou: 1 } },
      { text: "D. 五天", score: { shou: 1 } }
    ]
  },
  {
    id: "q15",
    type: "single",
    title: "如图所示，某本丸将要参加时之政府举行的“联队战~海边之阵~”，活动时间为9月24日10:00至10月15日5:00，活动期间将开启“3倍经验育成计划”。已知该本丸的资源量、小判数量皆为十亿，且该本丸有一队35级的极化太刀需要提升等级，该本丸至少需要参加几天活动才能获得全部的活动报酬？",
    img: "img15.jpg",
    options: [
      { text: "A. 一天", score: { zheng: 1 } },
      { text: "B. 一周", score: { shou: 1 } },
      { text: "C. 三周", score: { shou: 1 } },
      { text: "D. 一个月", react: "？海联都结束啦——" }
    ]
  }
];

/* ============================================================
   2. 结局配置
   ============================================================ */
const endings = [
  {
    id: "worker",
    title: "「优秀审神者称号」",
    text: "你认真答完了所有题，机动、编队、经验值全记得。心收没收不知道，但业务能力是真的强。",
    match: s => s.shou >= 60 && s.zheng < 30
  },
  {
    id: "pillar",
    title: "「本丸顶梁柱」",
    text: "你既记得正确答案，又忍不住选了各种梗。属于「上班摸鱼但活干完了」的类型。",
    match: s => s.shou >= 60 && s.zheng >= 60
  },
  {
    id: "meme",
    title: "「本丸梗王」",
    text: "你满脑子萝卜丸、表情包、光忠特制。收心？那是什么，能吃吗。",
    match: s => s.shou < 30 && s.zheng >= 60
  },
  {
    id: "lazy",
    title: "「心如止水」",
    text: "你轻松地答完了这套题，既没有特别认真，也没有特别整活。心如止水，波澜不惊——或者说，还没睡醒。",
    match: s => s.shou < 30 && s.zheng < 30
  },
  {
    id: "half",
    title: "「收了一半，另一半在摸鱼」",
    text: "你确实在努力收心，但刀男人的魅力实在太大。处于「想干活」和「想摸鱼」的量子叠加态。",
    match: () => true
  }
];

/* ============================================================
   3. 状态
   ============================================================ */
const answers = {};
let current = 0;
let reactTimer = null;

const qbox     = document.getElementById("qbox");
const progress = document.getElementById("progress");
const barFill  = document.getElementById("barFill");

/* ============================================================
   4. 渲染
   ============================================================ */
function render() {
  const q = questions[current];

  progress.textContent = `第 ${current + 1} / ${questions.length} 题`;
  barFill.style.width = `${(current / questions.length) * 100}%`;

  let html = `<div class="q-title">${q.title}</div>`;
  if (q.sub) html += `<div class="q-sub">${q.sub}</div>`;
  if (q.img) html += `<img class="q-img" src="${q.img}" alt="【图片占位：${q.img}】">`;

  /* ---------- 单选 ---------- */
  if (q.type === "single") {
    if (!Array.isArray(answers[q.id])) answers[q.id] = [];
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const sel = answers[q.id][0] === i ? " selected" : "";
      html += `<button class="option${sel}" data-i="${i}">${opt.text}</button>`;
    });
    html += `</div>`;
    html += `<div class="react-box" id="reactBox"></div>`;
    html += `<div class="btn-row">
               ${backBtnHTML()}
               <button class="btn" id="nextBtn">下一步</button>
             </div>`;
    qbox.innerHTML = html;

    qbox.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = parseInt(btn.dataset.i);
        answers[q.id] = [i];
        qbox.querySelectorAll(".option").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        showReact(q.options[i].react);
      });
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (!answers[q.id] || answers[q.id].length === 0) {
        alert("选一个再走嘛");
        return;
      }
      next();
    });
    bindBack();

  /* ---------- 多选 ---------- */
  } else if (q.type === "multi") {
    if (!Array.isArray(answers[q.id])) answers[q.id] = [];

    html += `<div class="multi-hint">可多选，选好后点「下一步」</div>`;
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const sel = answers[q.id].includes(i) ? " selected" : "";
      html += `<button class="option${sel}" data-i="${i}">${opt.text}</button>`;
    });
    html += `</div>`;
    html += `<div class="react-box" id="reactBox"></div>`;
    html += `<div class="btn-row">
               ${backBtnHTML()}
               <button class="btn" id="nextBtn">下一步</button>
             </div>`;
    qbox.innerHTML = html;

    const allBtns = qbox.querySelectorAll(".option");

    allBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const i = parseInt(btn.dataset.i);
        const opt = q.options[i];

        if (opt.text === "以下全部" || opt.text === "以上全部") {
          const arr = answers[q.id];
          const allSelected = arr.length === q.options.length;
          if (allSelected) {
            answers[q.id] = [];
            allBtns.forEach(b => b.classList.remove("selected"));
          } else {
            answers[q.id] = q.options.map((_, idx) => idx);
            allBtns.forEach(b => b.classList.add("selected"));
          }
          return;
        }

        const arr = answers[q.id];
        const idx = arr.indexOf(i);
        if (idx > -1) {
          arr.splice(idx, 1);
          btn.classList.remove("selected");
        } else {
          arr.push(i);
          btn.classList.add("selected");
        }
        showReact(opt.react);
      });
    });

    document.getElementById("nextBtn").addEventListener("click", next);
    bindBack();

  /* ---------- 填空 ---------- */
  } else if (q.type === "text") {
    html += `<input type="text" id="inputField" placeholder="${q.placeholder || ""}"
              value="${answers[q.id] || ""}">`;
    html += `<div class="btn-row">
               ${backBtnHTML()}
               <button class="btn" id="nextBtn">下一题</button>
             </div>`;
    qbox.innerHTML = html;

    const field = document.getElementById("inputField");
    field.addEventListener("input", () => {
      answers[q.id] = field.value;
    });
    field.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("nextBtn").click();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (q.isTrap && (answers[q.id] || "").trim() !== "") {
        showTrapEnding();
        return;
      }
      next();
    });
    bindBack();
  }

  qbox.classList.remove("fade");
  void qbox.offsetWidth;
  qbox.classList.add("fade");
}

/* 吐槽：淡入 → 停 1.2 秒 → 淡出 */
function showReact(text) {
  const box = document.getElementById("reactBox");
  if (!box) return;

  if (reactTimer) {
    clearTimeout(reactTimer);
    reactTimer = null;
  }

  if (!text) {
    box.classList.remove("show");
    box.textContent = "";
    return;
  }

  box.textContent = text;
  void box.offsetWidth;
  box.classList.add("show");

  reactTimer = setTimeout(() => {
    box.classList.remove("show");
    reactTimer = null;
  }, 1200);
}

function backBtnHTML() {
  return current > 0
    ? `<button class="btn btn-ghost" id="backBtn">← 上一题</button>`
    : `<span></span>`;
}

function bindBack() {
  const backBtn = document.getElementById("backBtn");
  if (backBtn) {
    backBtn.addEventListener("click", () => {
      current--;
      render();
    });
  }
}

/* ============================================================
   5. 翻页
   ============================================================ */
function next() {
  if (current < questions.length - 1) {
    current++;
    render();
  } else {
    showResult();
  }
}

/* ============================================================
   6. 陷阱结局
   ============================================================ */
function showTrapEnding() {
  const name = (answers.q1 || "").trim();
  progress.textContent = "测试结束";
  barFill.style.width = "100%";

  qbox.innerHTML = `
    <div class="result">
      <h2>让你填你就填？</h2>
      <p style="color:#a8a29a;font-size:.95em;line-height:1.8;">
        警惕心不高啊，亲爱的？<br>
        第一题的正确操作是——<strong style="color:#c9a86a;">直接点下一题</strong>。
      </p>
      <div class="score" style="font-size:1.4em;margin-top:24px;">收心进度 0%</div>
      <div class="score-label">诊断：看起来还没睡醒，警惕心有点太低了？</div>
      <div class="diagnosis">
        <strong>${escapeHTML(name) || "这位审神者"}，你中招了。</strong>
        下次小心？
      </div>
      <button class="btn" id="restartBtn" style="margin-top:24px;">重新填写</button>
    </div>
  `;
  bindRestart();
}

/* ============================================================
   7. 结果页
   ============================================================ */
function showResult() {
  let shouGot = 0, zhengGot = 0;
  let shouMax = 0, zhengMax = 0;

  questions.forEach(q => {
    if (q.isTrap) return;

    if (q.type === "multi") {
      let qShouMax = 0, qZhengMax = 0;
      q.options.forEach(o => {
        const s = o.score || {};
        qShouMax += s.shou || 0;
        qZhengMax += s.zheng || 0;
      });
      shouMax += qShouMax;
      zhengMax += qZhengMax;

      const picked = answers[q.id] || [];
      picked.forEach(i => {
        const s = q.options[i].score || {};
        shouGot += s.shou || 0;
        zhengGot += s.zheng || 0;
      });

    } else if (q.type === "single") {
      let qShouMax = 0, qZhengMax = 0;
      q.options.forEach(o => {
        const s = o.score || {};
        if ((s.shou || 0) > qShouMax) qShouMax = s.shou || 0;
        if ((s.zheng || 0) > qZhengMax) qZhengMax = s.zheng || 0;
      });
      shouMax += qShouMax;
      zhengMax += qZhengMax;

      const picked = answers[q.id];
      if (picked && picked.length) {
        const s = q.options[picked[0]].score || {};
        shouGot += s.shou || 0;
        zhengGot += s.zheng || 0;
      }
    }
  });

  const shouPct  = shouMax  > 0 ? Math.round((shouGot  / shouMax)  * 100) : 0;
  const zhengPct = zhengMax > 0 ? Math.round((zhengGot / zhengMax) * 100) : 0;

  const ending = endings.find(e => e.match({ shou: shouPct, zheng: zhengPct })) || endings[endings.length - 1];

  progress.textContent = "测试结束";
  barFill.style.width = "100%";

  qbox.innerHTML = `
    <div class="result">
      <h2>${ending.title}</h2>
      <div class="two-scores">
        <div class="item">
          <div class="num">${shouPct}%</div>
          <div class="lbl">收心值</div>
        </div>
        <div class="item">
          <div class="num">${zhengPct}%</div>
          <div class="lbl">整活值</div>
        </div>
      </div>
      <div class="diagnosis">
        <strong>${escapeHTML(answers.q1 || "这位审神者")}，诊断如下：</strong>
        ${ending.text}
      </div>
      <button class="btn" id="restartBtn" style="margin-top:24px;">重新测试</button>
    </div>
  `;
  bindRestart();
}

function bindRestart() {
  document.getElementById("restartBtn").addEventListener("click", () => {
    Object.keys(answers).forEach(k => delete answers[k]);
    current = 0;
    showCover();
  });
}

/* ============================================================
   8. 工具
   ============================================================ */
function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ============================================================
   9. 封面
   ============================================================ */
function showCover() {
  progress.textContent = "";
  barFill.style.width = "0%";

  qbox.innerHTML = `
    <div class="cover">
      <div class="cover-sub">时之政府 · 审神者健康管理中心</div>
      <h1 class="cover-title">审神者收心测试</h1>
      <p class="cover-desc">
        假期结束了，你的心收回来了吗？<br>
        本测试将评估你当前的收心进度，<br>
        并出具一份不具任何参考价值的诊断报告。
      </p>
      <p class="cover-note">温馨提示：题目答案仁者见仁智者见智，娱乐为上。</p>
      <button class="btn cover-btn" id="startBtn">开始测试</button>
    </div>
  `;
  qbox.classList.remove("fade");
  void qbox.offsetWidth;
  qbox.classList.add("fade");

  document.getElementById("startBtn").addEventListener("click", () => {
    current = 0;
    render();
  });
}

/* 启动 */
showCover();
</script>
